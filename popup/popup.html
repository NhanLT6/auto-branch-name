<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy As</title>
    <style>
      :root {
        --panel: #ffffff;
        --panel2: #faf9f7;
        --ink: #1b1a17;
        --muted: #78756d;
        --faint: #a8a49b;
        --line: rgba(20, 18, 14, 0.1);
        --line2: rgba(20, 18, 14, 0.17);
        --hover: rgba(20, 18, 14, 0.05);
        --succ: #3f7d5a;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono:
          ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Consolas, monospace;
      }
      :root[data-theme='dark'] {
        --panel: #2c2b28;
        --panel2: #262422;
        --ink: #eceae3;
        --muted: #a4a196;
        --faint: #767269;
        --line: rgba(255, 255, 255, 0.11);
        --line2: rgba(255, 255, 255, 0.18);
        --hover: rgba(255, 255, 255, 0.06);
        --succ: #82c99e;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --panel: #2c2b28;
          --panel2: #262422;
          --ink: #eceae3;
          --muted: #a4a196;
          --faint: #767269;
          --line: rgba(255, 255, 255, 0.11);
          --line2: rgba(255, 255, 255, 0.18);
          --hover: rgba(255, 255, 255, 0.06);
          --succ: #82c99e;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 322px;
        background: var(--panel);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }
      body.closing {
        opacity: 0;
        transform: scale(0.95) translateY(-4px);
      }
      .mono {
        font-family: var(--mono);
      }

      .ph {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 13px 15px 12px;
        border-bottom: 1px solid var(--line);
      }
      .ph-mark {
        width: 17px;
        height: 17px;
        flex: none;
        display: block;
      }
      .ph-t {
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: -0.01em;
      }
      .ph-s {
        font-size: 10.5px;
        color: var(--faint);
        letter-spacing: 0.02em;
      }
      .set-btn {
        margin-left: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5px;
        border-radius: 7px;
        cursor: pointer;
        background: none;
        border: none;
        color: var(--muted);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .set-btn:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .set-btn svg {
        display: block;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 11px 15px;
        cursor: pointer;
        position: relative;
        border: none;
        background: none;
        text-align: left;
        font: inherit;
        color: inherit;
        transition: background 0.15s ease;
      }
      .row:hover {
        background: var(--hover);
      }
      .tile {
        position: relative;
        width: 31px;
        height: 31px;
        border-radius: 9px;
        border: 1px solid var(--line2);
        background: var(--panel2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .tile-mono {
        display: flex;
        color: var(--muted);
        transition: opacity 0.12s;
      }
      .tile svg {
        display: block;
      }
      .chk-ov {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 14px;
        line-height: 1;
        opacity: 0;
        transition: opacity 0.12s;
      }
      .row-tx {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .row-nm {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .row-sp {
        font-size: 10.5px;
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 198px;
      }
      .row.copied .tile {
        background: var(--succ);
        border-color: transparent;
      }
      .row.copied .tile-mono {
        opacity: 0;
      }
      .row.copied .chk-ov {
        opacity: 1;
      }

      .pf {
        padding: 10px 15px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--faint);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <!-- HEADER: extension mark, wordmark, "this page" caption, settings gear -->
    <div class="ph">
      <svg class="ph-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect
          x="0"
          y="0"
          width="64"
          height="64"
          rx="12"
          style="fill: var(--ink)"
        />
        <rect
          x="10"
          y="10"
          width="31"
          height="31"
          rx="7"
          style="fill: none; stroke: var(--panel); stroke-width: 4.5"
        />
        <rect
          x="23"
          y="23"
          width="31"
          height="31"
          rx="7"
          style="fill: var(--ink); stroke: var(--panel); stroke-width: 4.5"
        />
      </svg>
      <span class="ph-t">Copy as</span>
      <span class="ph-s">this page</span>
      <button
        class="set-btn"
        id="settingsBtn"
        title="Settings"
        aria-label="Settings"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          />
        </svg>
      </button>
    </div>

    <!-- ACTION ROWS: click to copy that format -->
    <button class="row" data-action="copy-as-branch">
      <span class="tile"
        ><span class="tile-mono"
          ><svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="6" y1="3" x2="6" y2="15" />
            <circle cx="18" cy="6" r="3" />
            <circle cx="6" cy="18" r="3" />
            <path d="M18 9a9 9 0 0 1-9 9" /></svg></span
        ><span class="chk-ov">✓</span></span
      >
      <span class="row-tx">
        <span class="row-nm">Branch</span>
        <span class="row-sp mono" data-role="branch-sample"
          >feature/&hellip;</span
        >
      </span>
    </button>

    <button class="row" data-action="copy-as-title">
      <span class="tile"
        ><span class="tile-mono"
          ><svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="4 7 4 4 20 4 20 7" />
            <line x1="9" y1="20" x2="15" y2="20" />
            <line x1="12" y1="4" x2="12" y2="20" /></svg></span
        ><span class="chk-ov">✓</span></span
      >
      <span class="row-tx">
        <span class="row-nm">Title</span>
        <span class="row-sp" data-role="title-sample"
          >Plain formatted title</span
        >
      </span>
    </button>

    <button class="row" data-action="copy-as-rich-text">
      <span class="tile"
        ><span class="tile-mono"
          ><svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 17H7A5 5 0 0 1 7 7h2" />
            <path d="M15 7h2a5 5 0 0 1 0 10h-2" />
            <line x1="8" y1="12" x2="16" y2="12" /></svg></span
        ><span class="chk-ov">✓</span></span
      >
      <span class="row-tx">
        <span class="row-nm">Rich text</span>
        <span class="row-sp">Clickable HTML link</span>
      </span>
    </button>

    <button class="row" data-action="copy-as-markdown">
      <span class="tile"
        ><span class="tile-mono"
          ><svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 16V8l4 5 4-5v8" />
            <path d="M18 8v8" />
            <path d="M15 13l3 3 3-3" /></svg></span
        ><span class="chk-ov">✓</span></span
      >
      <span class="row-tx">
        <span class="row-nm">Markdown</span>
        <span class="row-sp mono" data-role="markdown-sample"
          >[title](url)</span
        >
      </span>
    </button>

    <button class="row" data-action="copy-as-teams">
      <span class="tile"
        ><span class="tile-mono"
          ><svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg></span
        ><span class="chk-ov">✓</span></span
      >
      <span class="row-tx">
        <span class="row-nm">Teams</span>
        <span class="row-sp">Rich link for Teams</span>
      </span>
    </button>

    <!-- FOOTER -->
    <div class="pf">
      Click a format to copy. The popup closes automatically.
    </div>

    <script src="./popup.js"></script>
  </body>
</html>
